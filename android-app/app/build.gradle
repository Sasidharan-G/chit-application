plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // id 'com.google.gms.google-services' // applied conditionally at the bottom of this file
    // id 'com.google.firebase.crashlytics'
}

// Release signing. Put the real values in android-app/keystore.properties (git-ignored, see
// keystore.properties.example); without that file the release build is produced UNSIGNED, which
// cannot be installed or uploaded to Play. The keystore and its passwords must never be committed.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.jothivel.chits'
    compileSdk 34

    defaultConfig {
        applicationId "com.jothivel.chits"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // Room exports its schema JSON here so every released database version is kept in git and
        // migrations can be verified against the real previous schema (see MigrationTest).
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        if (keystoreProps.containsKey('storeFile')) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Debug stays un-minified for fast iteration
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "JothiVelChits-${variant.name}-v${variant.versionName}.apk"
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Room DB for offline-first
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2023.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.activity:activity-compose:1.8.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    
    // Core Kotlin
    implementation 'androidx.core:core-ktx:1.12.0'

    // Firebase — real-time sync for the Labour/Agent collection feature (Firestore) and
    // agent identity lookups (Auth libs present for future use). Requires app/google-services.json.
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase (Disabled temporarily until valid google-services.json is provided)
    // implementation 'com.google.firebase:firebase-crashlytics'
    // implementation 'com.google.firebase:firebase-analytics'

    // Unit tests — Robolectric runs Room against a real in-memory SQLite DB inside the JVM,
    // so CollectionService/LedgerViewModel calculation logic is tested against the actual
    // DAOs and queries instead of a hand-rolled fake.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}

android {
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// The google-services plugin fails the build if app/google-services.json is missing.
// Apply it only once that file has been added (see PART 1.2 of firebase_agent_prompt.md),
// so the project keeps compiling for everyone until a real Firebase project is wired up.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
